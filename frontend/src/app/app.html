<header class="topbar">
  <nav class="nav">
    <a class="brand" routerLink="/">ai_test blog</a>
    <ul class="nav-links">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Home
        </a>
      </li>
      <li><a routerLink="/about" routerLinkActive="active">About</a></li>

      @if (isAuthenticated()) {
        <li><a routerLink="/admin" routerLinkActive="active">Admin</a></li>
        <li>
          <button type="button" class="link-button" (click)="logout()">Logout</button>
        </li>
      } @else {
        <li><a routerLink="/login" routerLinkActive="active">Login</a></li>
        <li><a routerLink="/register" routerLinkActive="active">Register</a></li>
      }
    </ul>
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="footer">
  <small>ai_test — learning project</small>
</footer>
