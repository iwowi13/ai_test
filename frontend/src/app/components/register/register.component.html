<section class="register">
  <h1>Register</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Please enter a valid email.</small>
      }
    </label>

    <label>
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Password must be at least 8 characters.</small>
      }
    </label>

    <label>
      <span>Confirm password</span>
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />
      @if (
        form.controls.confirmPassword.touched &&
        form.errors?.['mismatch'] &&
        form.controls.confirmPassword.value
      ) {
        <small class="field-error">Passwords do not match.</small>
      }
    </label>

    @if (errorMsg(); as msg) {
      <div class="form-error" role="alert">{{ msg }}</div>
    }

    <button type="submit" [disabled]="submitting() || form.invalid">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>
</section>
